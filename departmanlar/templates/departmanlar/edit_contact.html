<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kişi Düzenle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #222; font-family: 'Inter', Arial, sans-serif; color: #f4f6f8; }
        .card { border-radius: 18px; background: #232323; box-shadow: 0 8px 32px rgba(0,0,0,0.18); border: none; padding: 32px 32px 24px 32px; }
        h2 { color: #ffae42; font-weight: 700; letter-spacing: 1px; font-size: 2rem; }
        .btn-primary { background: #ffae42; color: #232323; font-weight: 600; border: none; border-radius: 8px; padding: 8px 18px; font-size: 1rem; transition: background 0.2s; }
        .btn-primary:hover { background: #ffd18c; color: #232323; }
        .btn-secondary { background: #6c757d; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 1rem; transition: background 0.2s; }
        .btn-secondary:hover { background: #5a6268; color: #fff; }
        .form-control, .form-select {
            background: #282828;
            border: 1px solid #393939;
            color: #f4f6f8;
        }
        .form-control:focus, .form-select:focus {
            background: #282828;
            border-color: #ffae42;
            color: #f4f6f8;
            box-shadow: 0 0 0 0.2rem rgba(255, 174, 66, 0.25);
        }
        .form-check-input {
            background-color: #282828;
            border-color: #393939;
        }
        .form-check-input:checked {
            background-color: #ffae42;
            border-color: #ffae42;
        }
        .navbar {
            background: #232323 !important;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .navbar-nav .nav-link {
            color: #f4f6f8 !important;
            font-weight: 600;
        }
        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active {
            color: #ffae42 !important;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}" style="color: #ffae42; font-weight: 700;">Departman Paneli</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'dashboard' %}">Ana Sayfa</a>
                <a class="nav-link" href="{% url 'bulk_message_panel' %}">Toplu Mesajlaşma</a>
                <a class="nav-link" href="{% url 'logout' %}">Çıkış</a>
            </div>
        </div>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <h2 class="text-center mb-4">Kişi Düzenle</h2>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'bulk_message_panel' %}" class="btn btn-secondary me-md-2">İptal</a>
                        <button type="submit" class="btn btn-primary">Güncelle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
